<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #eef2ff;
            --success: #10b981;
            --success-light: #ecfdf5;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --danger: #f43f5e;
            --danger-light: #fff1f2;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --border: #e5e7eb;
            --bg: #f1f5f9;
            --card: #ffffff;
            --radius: 16px;
            --shadow: 0 4px 24px rgba(15,23,42,0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px 40px;
        }

        /* ── Floating Action Buttons ── */
        .fab-group {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            gap: 10px;
        }
        .fab-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            border: none;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }
        .fab-close {
            background: #ffffff;
            color: #475569;
            border: 1.5px solid var(--border);
        }
        .fab-close:hover { background: #fff1f2; color: var(--danger); border-color: var(--danger); }
        .fab-print {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
        }
        .fab-print:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }

        /* ── Card Wrapper ── */
        .rc-wrap {
            max-width: 820px;
            margin: 0 auto;
        }

        /* ── Loading ── */
        .rc-loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .rc-loading .spin {
            width: 44px; height: 44px;
            border: 4px solid #e5e7eb;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Header ── */
        .rc-header {
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 60%, #7c3aed 100%);
            border-radius: var(--radius) var(--radius) 0 0;
            padding: 32px 36px 28px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .rc-header::before {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 200px; height: 200px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
        }
        .rc-header::after {
            content: '';
            position: absolute;
            bottom: -40px; left: 30%;
            width: 150px; height: 150px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
        }
        .rc-header-top {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            position: relative; z-index: 1;
        }
        .rc-header-icon {
            width: 56px; height: 56px;
            background: rgba(255,255,255,0.15);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .rc-header-info { flex: 1; }
        .rc-header-institute {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.65);
            margin-bottom: 6px;
        }
        .rc-header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        .rc-header-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .rc-meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            font-size: 11.5px;
            font-weight: 500;
            color: rgba(255,255,255,0.9);
        }
        .rc-status-pill {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .rc-status-published { background: rgba(16,185,129,0.25); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
        .rc-status-draft { background: rgba(245,158,11,0.25); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }

        /* ── Student Bar ── */
        .rc-student-bar {
            background: #fff;
            padding: 20px 36px;
            display: flex;
            align-items: center;
            gap: 18px;
            border-bottom: 1px solid var(--border);
        }
        .rc-avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
            border: 3px solid var(--primary-light);
            overflow: hidden;
        }
        .rc-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .rc-student-info h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 17px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
        }
        .rc-student-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .rc-student-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .rc-student-tag i { color: var(--primary); font-size: 11px; }

        /* ── Summary Grid ── */
        .rc-summary {
            background: #fff;
            padding: 24px 36px;
            border-bottom: 1px solid var(--border);
        }
        .rc-section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rc-section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .rc-summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        @media (max-width: 560px) { .rc-summary-grid { grid-template-columns: repeat(2, 1fr); } }
        .rc-summary-card {
            background: #f8fafc;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
        }
        .rc-summary-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .rc-summary-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: 14px 14px 0 0;
        }
        .rc-sc-blue::before { background: linear-gradient(90deg, #6366f1, #8b5cf6); }
        .rc-sc-green::before { background: linear-gradient(90deg, #10b981, #059669); }
        .rc-sc-gold::before { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .rc-sc-purple::before { background: linear-gradient(90deg, #8b5cf6, #6366f1); }
        .rc-sc-cyan::before { background: linear-gradient(90deg, #06b6d4, #0891b2); }
        .rc-sc-status::before { background: linear-gradient(90deg, #10b981, #06b6d4); }
        .rc-summary-card .sc-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            margin: 0 auto 10px;
        }
        .rc-sc-blue .sc-icon { background: var(--primary-light); color: var(--primary); }
        .rc-sc-green .sc-icon { background: #ecfdf5; color: #059669; }
        .rc-sc-gold .sc-icon { background: #fffbeb; color: #d97706; }
        .rc-sc-purple .sc-icon { background: #f5f3ff; color: #7c3aed; }
        .rc-sc-cyan .sc-icon { background: #ecfeff; color: #0891b2; }
        .rc-sc-status .sc-icon { background: #ecfdf5; color: #059669; }
        .rc-summary-card .sc-label {
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-light);
            margin-bottom: 6px;
        }
        .rc-summary-card .sc-value {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 800;
            line-height: 1;
        }
        .rc-sc-blue .sc-value { color: var(--primary); }
        .rc-sc-green .sc-value { color: #059669; }
        .rc-sc-gold .sc-value { color: #d97706; }
        .rc-sc-purple .sc-value { color: #7c3aed; }
        .rc-sc-cyan .sc-value { color: #0891b2; }
        .rc-sc-status .sc-value { font-size: 14px; }

        /* ── Subject Table ── */
        .rc-subjects {
            background: #fff;
            padding: 24px 36px;
            border-bottom: 1px solid var(--border);
        }
        .rc-subject-table {
            width: 100%;
            border-collapse: collapse;
        }
        .rc-subject-table thead tr {
            background: #f8fafc;
        }
        .rc-subject-table th {
            padding: 10px 14px;
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-muted);
            text-align: left;
            border-bottom: 2px solid var(--border);
        }
        .rc-subject-table th:last-child { text-align: center; }
        .rc-subject-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13.5px;
            vertical-align: middle;
        }
        .rc-subject-table tbody tr:last-child td { border-bottom: none; }
        .rc-subject-table tbody tr:hover { background: #fafbff; }
        .rc-sub-name {
            font-weight: 700;
            color: var(--text-main);
        }
        .rc-sub-marks {
            font-weight: 700;
            font-size: 15px;
        }
        .rc-sub-full { color: var(--text-muted); font-size: 12px; }
        .rc-bar-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .rc-bar-track {
            flex: 1;
            height: 8px;
            background: #e5e7eb;
            border-radius: 99px;
            overflow: hidden;
        }
        .rc-bar-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.6s ease;
        }
        .rc-bar-strong { background: linear-gradient(90deg, #10b981, #059669); }
        .rc-bar-avg { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .rc-bar-weak { background: linear-gradient(90deg, #f43f5e, #e11d48); }
        .rc-bar-pct { font-size: 12px; font-weight: 600; color: var(--text-muted); min-width: 36px; text-align: right; }
        .rc-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
        }
        .rc-badge-strong { background: #ecfdf5; color: #059669; }
        .rc-badge-avg { background: #fffbeb; color: #d97706; }
        .rc-badge-weak { background: #fff1f2; color: #e11d48; }

        /* ── Analysis ── */
        .rc-analysis {
            background: #fff;
            padding: 24px 36px;
            border-bottom: 1px solid var(--border);
        }
        .rc-analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 560px) { .rc-analysis-grid { grid-template-columns: 1fr; } }
        .rc-analysis-box {
            border-radius: 14px;
            padding: 16px 18px;
        }
        .rc-analysis-box.strength { background: #ecfdf5; border: 1.5px solid #a7f3d0; }
        .rc-analysis-box.weakness { background: #fff1f2; border: 1.5px solid #fecdd3; }
        .rc-analysis-title {
            font-size: 12.5px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rc-analysis-box.strength .rc-analysis-title { color: #059669; }
        .rc-analysis-box.weakness .rc-analysis-title { color: #e11d48; }
        .rc-analysis-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .rc-analysis-tag {
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 11.5px;
            font-weight: 600;
        }
        .strength .rc-analysis-tag { background: #d1fae5; color: #065f46; }
        .weakness .rc-analysis-tag { background: #ffe4e6; color: #9f1239; }

        /* ── Remarks ── */
        .rc-remarks {
            background: #fff;
            padding: 20px 36px;
            border-bottom: 1px solid var(--border);
        }
        .rc-remarks-box {
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            border-radius: 0 12px 12px 0;
            padding: 14px 18px;
            font-size: 14px;
            color: var(--text-muted);
            font-style: italic;
            line-height: 1.7;
        }
        .rc-remarks-box::before {
            content: '"';
            font-size: 28px;
            color: var(--primary);
            line-height: 0;
            vertical-align: -10px;
            margin-right: 4px;
            font-style: normal;
        }

        /* ── Progress Chart ── */
        .rc-progress {
            background: #fff;
            padding: 24px 36px;
            border-radius: 0 0 var(--radius) var(--radius);
        }
        .rc-chart-wrap {
            position: relative;
            width: 100%;
        }

        /* ── Footer ── */
        .rc-footer {
            background: #fff;
            border-top: 1px solid var(--border);
            border-radius: 0 0 var(--radius) var(--radius);
            padding: 14px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11.5px;
            color: var(--text-light);
        }
        .rc-footer-brand { font-weight: 700; color: var(--primary); }

        /* ── Card shadow wrapper ── */
        .rc-card-outer {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: 0 8px 40px rgba(15,23,42,0.12);
            overflow: hidden;
            margin-top: 60px;
        }

        /* ── Print ── */
        @media print {
            body { background: #fff; padding: 0; }
            .fab-group { display: none !important; }
            .rc-card-outer { margin-top: 0; box-shadow: none; border-radius: 0; }
            .rc-header { border-radius: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }

        @media (max-width: 600px) {
            .rc-header, .rc-student-bar, .rc-summary, .rc-subjects,
            .rc-analysis, .rc-remarks, .rc-progress, .rc-footer {
                padding-left: 18px;
                padding-right: 18px;
            }
            .rc-header-title { font-size: 17px; }
            .rc-summary-card .sc-value { font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- Floating Buttons -->
    <div class="fab-group">
        <button class="fab-btn fab-close" onclick="window.close()">
            <i class="fas fa-times"></i> Close
        </button>
        <button class="fab-btn fab-print" onclick="window.print()">
            <i class="fas fa-download"></i> Download PDF
        </button>
    </div>

    <div class="rc-wrap">
        <!-- Loading -->
        <div id="loadingSection" class="rc-card-outer rc-loading">
            <div class="spin"></div>
            <p>Loading result card...</p>
        </div>

        <!-- Content -->
        <div id="resultContent" style="display:none;">
            <div class="rc-card-outer">
                <div id="cardHeader"></div>
                <div id="studentInfoBar"></div>
                <div id="summaryGrid"></div>
                <div id="subjectBreakdown"></div>
                <div id="strengthWeakness"></div>
                <div id="remarksSection"></div>
                <div id="progressSection"></div>
                <div id="cardFooter"></div>
            </div>
        </div>
    </div>

    <script src="assets/js/result-card.js"></script>
</body>
</html>
