name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      disable_legacy_url:
        description: Disable the old edusmart-sms workers.dev URL
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Confirm deployment secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$JWT_SECRET" || { echo "Missing JWT_SECRET"; exit 1; }

      - name: Prepare iconv-lite for Workers bundling
        run: node backend/scripts/prepare-cloudflare-worker.cjs

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.135.0 deploy --config wrangler.toml

      - name: Apply Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          node -e 'require("node:fs").writeFileSync(".worker-secrets.json", JSON.stringify({ SUPABASE_SERVICE_ROLE_KEY: process.env.SUPABASE_SERVICE_ROLE_KEY, JWT_SECRET: process.env.JWT_SECRET }))'
          npx --yes wrangler@4.135.0 secret bulk .worker-secrets.json --config wrangler.toml
          rm -f .worker-secrets.json

      - name: Disable legacy Worker URL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.disable_legacy_url }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          response="$(curl --fail-with-body --silent --show-error --request DELETE \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/94cfd74b7d6b679805086b9724439a8e/workers/scripts/edusmart-sms/subdomain")"
          RESPONSE="$response" node -e 'const data = JSON.parse(process.env.RESPONSE); if (!data.success) { console.error(JSON.stringify(data.errors)); process.exit(1); }'
          echo "Disabled the old edusmart-sms workers.dev URL"
